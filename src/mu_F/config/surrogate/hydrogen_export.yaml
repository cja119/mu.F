
classifier: true
classifier_selection: 'ANN'  # 'SVM' | 'ANN' | 'ellipsoid' — 'ellipsoid'
                              # uses the DEUS terminal cluster cover as
                              # the feasibility predicate (no surrogate
                              # training; quadratic form inside septal).
regressor_selection: 'ANN'
probability_map: false

subsample_size: 5000      # trimmed from 100000 to limit SVM support-vector count
num_folds: 2

index_on: 1

# A-posteriori margin calibration: hold out a fraction of training, find
# the smallest backoff that suppresses 1-eps of the false-positive
# (admitted-infeasible) margins, add it back to the classifier output at
# rollout so the SQP lands inside the true feasible region.
backoff:
  enabled: true
  held_out_frac: 0.2
  epsilon: 0.05

classifier_args:
  standardised: true
  svm:
    kernel: ['rbf']
    C: [0.5, 1, 2]              # trimmed to cap support-vector count
    gamma: [0.2, 0.5, 1]        # trimmed to keep kernel smooth, fewer SVs
    probability: [False]
  ann:
    hidden_size_options:
      - [200, 200]
      - [100, 100, 50]
      - [100, 100]
      - [50, 50]
    activation_functions:
      - 'gelu'
      - 'tanh'

    decaying_lr_and_clip_param: True
    learning_rate: 0.01
    terminal_lr: 0.00001
    num_epochs: 1000
    min_delta: 0.000001
    patience: 50
    batch_size: 264
    weight_decay: 1.0e-4    # L2 to suppress phantom-feasibility interpolation


forward_evaluation_surrogate: false

post_process_lower:
  model_class: classification
  desired_node_index: 0


surrogate_forward:
  drop_uncertain_params: False
  ann:
    hidden_size_options:
      - [50, 50]
      - [50, 25]
      - [25, 10]
    activation_functions:
      - ['tanh', tanh]

    decaying_lr_and_clip_param: True
    learning_rate: 0.01
    terminal_lr: 0.00001
    num_epochs: 1000
    min_delta: 0.00001
    patience: 50
    batch_size: 264
    weight_decay: 0.0


surrogate_ctg:
  ann:
    hidden_size_options:
      - [50, 50]
      - [50, 25]
      - [25, 10]
    activation_functions:
      - ['tanh', tanh]

    decaying_lr_and_clip_param: True
    learning_rate: 0.01
    terminal_lr: 0.00001
    num_epochs: 1000
    min_delta: 0.00001
    patience: 50
    batch_size: 264
    weight_decay: 0.0
