
classifier: true
classifier_selection: 'ANN'
regressor_selection: 'ANN'
probability_map: false

# A-posteriori feasibility backoff. A batch of the original sampling data is held
# out of classifier training; the recovery's classifier margin (logit, so it does
# not saturate) is then tightened to the smallest value excluding all but a fraction
# `epsilon` of the held-out false positives.
backoff:
  enabled: true
  held_out_frac: 0.2
  epsilon: 0.05

subsample_size: 100000
num_folds: 2

index_on: 1

classifier_args:
  standardised: true
  svm:
    kernel: ['rbf']
    C: [20, 10, 2.5, 1, 0.1]
    gamma: [0.2, 1, 0.5, 2, 4, 6]
    probability: [False]
  ann:
    hidden_size_options:
      - [100, 100]
      - [100, 50]
      - [200, 200]
      - [50, 50]
      - [25, 10]
      - [10, 10]
    activation_functions:
      - ['tanh', tanh]

    decaying_lr_and_clip_param: True
    learning_rate: 0.01
    terminal_lr: 0.00001
    num_epochs: 1000
    min_delta: 0.000001
    patience: 50
    batch_size: 264
    weight_decay: 0.0


forward_evaluation_surrogate: false

post_process_lower:
  model_class: classification
  desired_node_index: 0


surrogate_forward:
  drop_uncertain_params: False
  ann:
    hidden_size_options:
      - [50, 50]
      - [50, 25]
      - [25, 10]
    activation_functions:
      - ['tanh', tanh]

    decaying_lr_and_clip_param: True
    learning_rate: 0.01
    terminal_lr: 0.00001
    num_epochs: 1000
    min_delta: 0.00001
    patience: 50
    batch_size: 264
    weight_decay: 0.0


surrogate_ctg:
  ann:
    hidden_size_options:
      - [50, 50]
      - [50, 25]
      - [25, 10]
    activation_functions:
      - ['tanh', tanh]

    decaying_lr_and_clip_param: True
    learning_rate: 0.01
    terminal_lr: 0.00001
    num_epochs: 1000
    min_delta: 0.00001
    patience: 50
    batch_size: 264
    weight_decay: 0.0

# Training-data augmentation around the converged feasibles. Opt-in per
# case study; legacy fallback to cfg.samplers.ns.n_anneal still applies
# while enabled is false.
augmentation:
  enabled: false
