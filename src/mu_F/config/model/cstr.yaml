root_node_inputs:
  - [0.8, 330.0, 296.0]   # [Ca, T, Tc_prev]; the root has no predecessor, so its
                          # 'previous' coolant is the mid-box value

constraint:
  auxiliary: 'None'

node_aux: None

feas_thresh: 0.1

memory: false

# pcgym model class to dispatch in cstr_simulator
pcgym_model_class: cstr_ode

# pcgym ENV_PARAMS that are used inside the simulator
N: 40
tsim: 52
sp_ca: [0.85, 0.85, 0.85, 0.85, 0.85, 0.85, 0.85, 0.85, 0.85, 0.85,
        0.85, 0.85, 0.85, 0.85, 0.85, 0.85, 0.85, 0.85, 0.85, 0.85,
        0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9,
        0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9,]

# Constraint thresholds (path constraints embedded in simulator G block)
t_lower: 315.0
t_upper: 331.0

# Setpoint-tracking penalty: 'smooth_log' keeps a steep gradient at the optimum for the
# nested sampler; 'quadratic' is smooth there so the monolithic SQP can certify KKT.
tracking_penalty: smooth_log

# Control-move penalty: lambda*(Tc_k - Tc_{k-1})^2 added to the stage cost.  The
# cost-to-go is nearly flat in Tc (~1-3% across the whole box, below the
# surrogate's own fit error), so the rollout chatters between near-indifferent
# controls; this gives the CTG real curvature in the action.  move_gain sets how
# fast the Tc state relaxes onto the applied control within a node (x tf).
move_penalty: 0.01
move_gain: 40.0

# Disturbance bounds (for Z, currently not injected in simulator but kept for symmetry)
disturbance_keys: ['Ti', 'Caf']
disturbance_low: [325.0, 0.95]
disturbance_high: [375.0, 1.05]

integration:
  scheme: tsit5                  # fixed-step explicit: smooth gradient for optimize-through-integration
  step_size_controller: constant
  t0: 0
  tf: 0.56
  dt0: 0.005
  max_steps: 100000
  vmap_chunk_size: 0
  adjoint: direct                # recursive checkpointing is incompatible with the exact-Hessian SQP

# Smoothness for the constraint-violation softmax (higher -> closer to the hard max).
softmax_beta:
  decomposition: 1000
  monolithic: 50

# Smoothness for the edge clip (per method; higher -> closer to hard clip).
edge_clip_beta:
  decomposition: 1000
  monolithic: 50
