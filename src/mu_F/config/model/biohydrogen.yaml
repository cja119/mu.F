root_node_inputs:
  - [0.2, 50.0, 100.0, 1.0, 20.0, 0.0, 0.0]
  # [X, C, N, q, O, H, F]
  # X(0)=0.2 g/L, C(0)=50 mmol/L, N(0)=100 mg/L (below 150 max), q(0)=1.0
  # (above k_q=0.628), O(0)=20 % (aerobic start — H2 production gate is
  # saturated, so H starts at ~0; eps_h_gate prevents the box-bound from
  # collapsing).  H(0)=0 mL/g, F(0)=0 L.

constraint:
  auxiliary: 'None'

node_aux: None

feas_thresh: 0.1

memory: false

# Kinetics (Eq. 1, sample_envs/biohydrogen.py)
mu_max: 0.04765    # 1/h
k_q: 0.6281        # –
k_c: 0.0           # mmol/L
mu_d: 0.008559     # L/g/h
k_n: 50.0          # mg/L
y_nx: 244.6        # mg/g
y_qx: 1.723        # –
y_ox: 14.6         # %·L/g/h
y_d: 26.22         # %·L/g
y_cx: 20.83        # mmol/g
y_hx: 2.34         # mL/g

# Feed
f_max: 0.1         # L (total feed budget over the horizon)
o_fed: 20.0        # %  (feed oxygen concentration)
c_fed: 50.0        # mmol/L

# Path-constraint thresholds
n_max: 150.0       # mg/L culture nitrate ceiling
o_max: 100.0       # % oxygen ceiling
n_switch: 100.0    # mg/L H₂-production switch (Eq. 1g f(N))

# Floor on (1 - σ(2·O)) gate; physically negligible, prevents the H
# state collapsing to identically zero across the first node integration.
eps_h_gate: 1.0e-6

integration:
  scheme: tsit5
  step_size_controller: pid
  t0: 0
  tf: 24           # hours per node
  dt0: Null
  max_steps: 100000
  vmap_chunk_size: 0
