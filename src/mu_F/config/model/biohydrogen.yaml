root_node_inputs:
  - [0.2, 1000.0, 150.0, 1.0, 20.0, 0.0]
  # [X, C, N, q, O, H] — carbon-rich charge so the system is nitrate-limited:
  # X(0)=0.2 g/L, C(0)=1000 mmol/L, N(0)=150 mg/L, q(0)=1.0 (above k_q=0.628),
  # O(0)=20 % (aerobic start, H2 gate saturated so H starts ~0), H(0)=0 mL/g.

constraint:
  auxiliary: 'global'

node_aux: None

feas_thresh: 0.1

memory: false

# Kinetics (Eq. 1, sample_envs/biohydrogen.py)
mu_max: 0.04765    # 1/h
k_q: 0.6281        # –
k_c: 0.0           # mmol/L
c_jitter: 0.1      # mmol/L carbon roll-off scale δ in C/(k_c+√(C²+δ²)) — smooth, pole-free (k_c=0)
mu_d: 0.008559     # L/g/h
k_n: 50.0          # mg/L
y_nx: 244.6        # mg/g
y_qx: 1.723        # –
y_ox: 14.6         # %·L/g/h
y_d: 26.22         # %·L/g
y_cx: 20.83        # mmol/g
y_hx: 2.34         # mL/g

# Feed
f_max: 0.1         # L total influent fed over [T, horizon] (eq 1i numerator)
o_fed: 20.0        # %  (feed oxygen concentration)
c_fed: 1000.0      # mmol/L (= C0; carbon-rich so sustaining nitrate is the binding control, not carbon)

# Path-constraint thresholds
n_max: 150.0       # mg/L culture nitrate ceiling
o_max: 100.0       # % oxygen ceiling
c_min: 0.0         # mmol/L glycerol floor (carbon source non-negative, as the paper's state bounds do)
n_switch: 100.0    # mg/L H₂-production threshold (eq 1g f(N); eq 1h gates on O)
t_switch_beta: 2.0 # feed-start gate steepness in node units (~1-node transition)

# Feed parameterisation: False optimises N_Fed directly so the H₂-gate cliff stays
# resolvable to the CTG surrogate (log space crushed it against the bound). Pairs
# with the linear design_args bound in case_study/biohydrogen.yaml.
feed_log_space: false

# Reward scaling: normalises the path/terminal H₂ reward so the monolithic
# objective is O(1) (the raw objective ~ -2.7e4, dominated by the H accumulator).
reward_scale: 1.0e4

integration:
  scheme: tsit5              # fixed-step explicit: bounded gradient memory + accurate at dt0=0.05
  step_size_controller: constant
  t0: 0
  tf: 24           # hours per node
  dt0: 0.02        # 1200 steps/node; finer for the stiffer carbon-rich (C0=1000) fast-growth dynamics
  max_steps: 5000
  vmap_chunk_size: 0

# f(N)/f(O) dynamics-switch smoothing (eqs 1g-1h): paper-hard 0.1 for the
# sampling-based decomposition; softer for the gradient-based monolithic so the
# shooting-continuity Jacobian stays well-conditioned.  Evaluate at 0.1.
switch_smooth:
  decomposition: 0.1
  monolithic: 1.0

# Smoothness for the constraint-violation softmax (higher -> closer to the hard max).
softmax_beta:
  decomposition: 1000
  monolithic: 1000

# Smoothness for the edge clip (per method; higher -> closer to hard clip).
edge_clip_beta:
  decomposition: 1000
  monolithic: 1000
