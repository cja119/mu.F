root_node_inputs:
  - [0.2, 50.0, 100.0, 1.0, 20.0, 0.0, 0.0]
  # [X, C, N, q, O, H, F]
  # X(0)=0.2 g/L, C(0)=50 mmol/L, N(0)=100 mg/L (below 150 max), q(0)=1.0
  # (above k_q=0.628), O(0)=20 % (aerobic start — H2 production gate is
  # saturated, so H starts at ~0; eps_h_gate prevents the box-bound from
  # collapsing).  H(0)=0 mL/g, F(0)=0 L.

constraint:
  auxiliary: 'global'

node_aux: None

feas_thresh: 0.1

memory: false

# Kinetics (Eq. 1, sample_envs/biohydrogen.py)
mu_max: 0.04765    # 1/h
k_q: 0.6281        # –
k_c: 0.0           # mmol/L
mu_d: 0.008559     # L/g/h
k_n: 50.0          # mg/L
y_nx: 244.6        # mg/g
y_qx: 1.723        # –
y_ox: 14.6         # %·L/g/h
y_d: 26.22         # %·L/g
y_cx: 20.83        # mmol/g
y_hx: 2.34         # mL/g

# Feed
f_max: 0.1         # L (total feed budget over the horizon)
o_fed: 20.0        # %  (feed oxygen concentration)
c_fed: 50.0        # mmol/L

# Path-constraint thresholds
n_max: 150.0       # mg/L culture nitrate ceiling
o_max: 100.0       # % oxygen ceiling
n_switch: 100.0    # mg/L H₂-production switch (Eq. 1g f(N))
n_switch_beta: 1.0 # N-gate steepness; lower -> gentler switch
o_gate_beta: 2.0   # O-gate steepness (aerobic/anaerobic); lower -> gentler, eases the monolithic trap

# Reward scaling: normalises the path/terminal H₂ reward so the monolithic
# objective is O(1) (the raw objective ~ -2.7e4, dominated by the H accumulator).
reward_scale: 1.0e4

integration:
  scheme: tsit5              # fixed-step explicit: bounded gradient memory + accurate at dt0=0.05
  step_size_controller: constant
  t0: 0
  tf: 24           # hours per node
  dt0: 0.05        # 480 steps/node; matches Kvaerno5 to 5 d.p. (0.1 is too coarse)
  max_steps: 5000
  vmap_chunk_size: 0

# Smoothness for the constraint-violation softmax (higher -> closer to the hard max).
softmax_beta:
  decomposition: 1000
  monolithic: 50

# Smoothness for the edge clip (per method; higher -> closer to hard clip).
edge_clip_beta:
  decomposition: 1000
  monolithic: 1000
