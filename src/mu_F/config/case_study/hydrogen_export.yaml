case_study: hydrogen_export

make_markov: True

vmap_evaluations: True

eval_cost: True

num_nodes: 24

adjacency_matrix: None

n_design_args: 3

n_aux_args:
  node_0: 0
  (0,1): 0

n_input_args: 3

reject_time: 5

discount_factor: 0.99999

sizes:
  X_SIZE: 3
  U_SIZE: 3
  F_SIZE: 3
  G_SIZE: 7
  Z_SIZE: 1
  L_SIZE: 1
  PHI_SIZE: 0

# u = [n_active, delta_throughput, power_action]
# delta_throughput in calorific-energy units — the change in throughput
# applied this step. Bounds: ±(n_trains · per-train calorific cap) × ramp rates.
#   lower = -lower_ramp_limit · train_throughput_capacity · vector_calorific_value · n_trains_conversion
#   upper = +upper_ramp_limit · train_throughput_capacity · vector_calorific_value · n_trains_conversion
# Simulator: throughput_new = _throughput + delta_throughput.
#
# power_action is a single signed electrical control: negative ⇒ fuel cell
# discharges |power_action|; positive ⇒ electrolyser absorbs power_action.
# The simulator softplus-splits it into the two physical streams, so the SQP
# only ever optimises over one continuous variable instead of a fc/el pair
# that should be mutually exclusive.
#   lower = -hfc_capacity   (= -832)
#   upper = +max electrolyser DV bound (= +18954.2)
KS_bounds:
  design_args:
  - - 0.0
    - 4.0
  - - -2143.2
    - 857.28
  - - -832.0
    - 18954.2
  aux_args:
  - - - None
      - None

parameters_samples: [{'c': [0.02048169, 11.87977224, 0.29061465, 7.13482955, 7.78359092],
                      'w': [0.07390548, 0.54504614, 0.12598331, 0.12247117, 0.13259390]}]

parameters_best_estimate: [8.420454054312653]

extendedDS_bounds:
  - [0.0, 4.0]              # n_active (control)
  - [-2143.2, 857.28]        # delta_throughput (control, calorific units)
  - [-832.0, 18954.2]       # power_action (control; <0 = fuel cell, >0 = electrolyser)
  # Predecessor-state bounds deliberately overshoot the *physically* feasible
  # band on both sides.  DEUS samples joint (action, state) over these boxes;
  # samples with state outside the constraint-satisfying region get rejected
  # under positive notion and become negative training examples for the
  # multi-head classifier — so the boundary is learnt from BOTH sides instead
  # of being inferred by smooth extrapolation past the feasible interior.
  - [0.0, 350000.0]         # _storage  (physical [59087, 295435] — widen to expose floor/ceiling)
  - [0.0, 10000.0]          # _throughput  (physical [0, 8572.8] — widen past 4-train cap)
  - [0.0, 4.0]              # _n_active  (already covers full integer range)

edge_clip:
  - [59087, 295435]    # storage
  - [0.0, 8572.8]      # throughput (4-train calorific capacity)
  - [0, 4]             # n_active

design_space_dimensions:
- 'u0'
- 'u1'

design_domain:
- [0, 1, 2, 3, 4]   # n_active (integer — number of active conversion trains; 0 = shutdown)
- 'real'         # delta_throughput
- 'real'         # power_action (signed: <0 = fuel cell discharging, >0 = electrolyser absorbing)
# Per-design-arg domain (length = n_design_args). 'real' = continuous;
# replace with a list of allowed integer values to declare an integer dim.
# make_markov tiles this template across nodes.

global_n_aux_args: 0

aux_default: []
# Rollout-time default for the global aux slot (empty: no global aux vars here).

process_space_names: ['u0', 'u1']

mode:
  - backward
  - rollout

evaluation_mode: 'jax-pmap'

serial_graph: True

unit_op: 'steady_state'

n_theta: 1

fn_evals: 0

bypass_visualisations: True
