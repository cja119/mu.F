case_study: biohydrogen

make_markov: True

vmap_evaluations: True

eval_cost: True

# 30 nodes × 24 h = 30 days (`REPEATS` in the cluster wrapper).
num_nodes: 30

adjacency_matrix: None

n_design_args: 2

n_aux_args:
  node_0: 1
  (0,1): 1

global_n_aux_args: 1

n_input_args: 7

reject_time: 0.5

discount_factor: 0.99999

sizes:
  X_SIZE: 7    # X, C, N, q, O, H, F
  U_SIZE: 2    # N_Fed, F_in
  F_SIZE: 7
  G_SIZE: 4    # N <= 150 mg/L, O <= 100 %, F <= F_max, F_in <= max_fr·F_max/tf
  Z_SIZE: 0
  L_SIZE: 1    # path reward: -Y_HX·X·(1-σ(2O))·f(N) (no /1000 scaling)
  PHI_SIZE: 1  # terminal-style: dPHI/dt = -H/tf -> integral per node = -mean(H)


KS_bounds:
  design_args:
  - - 1.0
    - 3000.0
  - - -13.81551    # log(1e-6)
    - -6.57897     # log(1.39e-3)

  aux_args:
  - - - 0.0
      - 1.0


parameters_samples: [{'c': [0.0], 'w': 1.0}]

parameters_best_estimate: [0.0]

# 9-d extended DS for reconstruction plotting:
#   [N_Fed, F_in, X, C, N, q, O, H, F]
extendedDS_bounds: None

edge_clip:
  - [0.0, 5.0]         # X    biomass
  - [0.0, 60.0]        # C    carbon
  - [0.0, 250.0]       # N    culture nitrate
  - [0.01, 5.0]        # q    quota (keep above 1e-2 so k_q/q stays bounded)
  - [0.0, 110.0]       # O    oxygen %
  - [0.0, 10000.0]     # H    H2 accumulator (was 1000; physical max ~8400)
  - [-1.0e6, 1.0e6]    # F    feed accumulator — no clip; g_F PC enforces ≤ F_max

design_space_dimensions:
- 'u0'
- 'u1'

design_domain:
- 'real'
- 'real'
# Per-design-arg domain. 'real' = continuous; replace with a list of allowed
# integer values (e.g. [1, 2, 3]) to declare an integer dim.  make_markov
# tiles this template across nodes.

process_space_names: ['N', 'log_F_in']

mode:
  - backward
  - rollout

evaluation_mode: 'jax-pmap'

serial_graph: True

unit_op: 'dynamic'

n_theta: 1

fn_evals: 0

bypass_visualisations: True
