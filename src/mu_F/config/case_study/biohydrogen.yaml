case_study: biohydrogen

make_markov: True

vmap_evaluations: True

eval_cost: True

# 30 nodes × 24 h = 30 days (`REPEATS` in the cluster wrapper).
num_nodes: 30

# Glycerol handling: 'fixed' = our smooth pole-free carbon roll-off with C>=0 (physical);
# 'paper' = original K_c=0 term with C unbounded, reproducing the paper (and its hidden
# negative-glycerol artifact). Switches the carbon rate, the g_C floor, and the C edge-clip.
carbon_implementation: fixed

adjacency_matrix: None

n_design_args: 1

# One entry per aux slot; every node carries the whole block (the Markov
# template).  Order is positional: the model reads aux[i] for slot i.
#   global_var   -- edge-coupled, optimised at node 0
#   global_param -- edge-coupled, set before evaluation
#   local_param  -- per-node, never coupled, set before evaluation
#
# T = the feed-start time as a fraction of the horizon (eq 1i).  As a global_var
# the decomposition rollout solves it at the root and carries it forward;
# aux_override still pins it.  global_n_aux_args / aux_var_type / aux_default and
# the KS aux bounds are all derived from this block.
aux:
  - name: T
    type: global_var
    bounds: [0.0, 0.97]
    default: 0.1

n_input_args: 6

reject_time: 0.5

discount_factor: 0.99999

sizes:
  X_SIZE: 6    # X, C, N, q, O, H
  U_SIZE: 1    # N_Fed (daily nitrate influent); T is the global aux
  F_SIZE: 6
  G_SIZE: 3    # N <= 150 mg/L, O <= 100 %, C >= 0 (glycerol non-negative)
  Z_SIZE: 0
  L_SIZE: 1    # node reward: -dH = -Y_HX·X·(1-f(O))·f(N); sums to -H_final
  PHI_SIZE: 0  # no terminal term — objective is pure total H2 production


KS_bounds:
  design_args:
  # N_Fed = influent (feedstock) nitrate concentration, optimised in linear space
  # (feed_log_space: false) so the H₂-gate cliff stays resolvable; range matches the
  # former ln window [0, 12.21] -> [exp(0), exp(12.21)].
  - - 1.0
    - 200787.0

  aux_args: []     # derived from the `aux` block


parameters_samples: [{'c': [0.0], 'w': 1.0}]

parameters_best_estimate: [0.0]

extendedDS_bounds: None

edge_clip:
  - [0.0, 60.0]        # X    biomass (carbon-rich: can grow toward C0/Y_CX ~48 g/L)
  - [0.0, 1200.0]      # C    carbon (C0=1000, headroom above the charge)
  - [0.0, 250.0]       # N    culture nitrate
  - [0.01, 5.0]        # q    quota (keep above 1e-2 so k_q/q stays bounded)
  - [0.0, 110.0]       # O    oxygen %
  - [0.0, 10000.0]     # H    H2 accumulator (physical max ~8400)

design_space_dimensions:
- 'u0'
- 'u1'

design_domain:
- 'real'
- 'real'
# Per-design-arg domain. 'real' = continuous; replace with a list of allowed
# integer values (e.g. [1, 2, 3]) to declare an integer dim.  make_markov
# tiles this template across nodes.

process_space_names: ['N']

mode:
  - backward
  - rollout

evaluation_mode: 'jax-pmap'

serial_graph: True

unit_op: 'dynamic'

n_theta: 1

fn_evals: 0

bypass_visualisations: True
