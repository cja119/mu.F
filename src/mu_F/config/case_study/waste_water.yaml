case_study: waste_water

make_markov: True

vmap_evaluations: True

eval_cost: True

num_nodes: 72

adjacency_matrix: None

n_design_args: 1

n_aux_args:
  node_0: 1
  (0,1): 1

n_input_args: 6

reject_time: 0.5

discount_factor: 0.99999

sizes:
  X_SIZE: 6
  U_SIZE: 1
  F_SIZE: 6
  G_SIZE: 5
  Z_SIZE: 4
  L_SIZE: 1
  PHI_SIZE: 0

KS_bounds:
  design_args:
  - - -4.60517    # log(0.01)
    - 0.693147    # log(2.0)
  # u[0] = log(D); D = exp(u[0]) inside the step.  Log-uniform Sobol
  # crowds the small-D (near-steady-state, more-feasible) region while
  # still reaching the washout edge near D = 2.

  aux_args:
  - - - 0.5
      - 1.0
  # Global aux: α (biomass-in-liquid fraction). 0.5 = published AM2 fixed-bed
  # retention (Bernard 2001); 1.0 = perfect-mixing chemostat (no retention).

parameters_samples: [{'c': [3.0, 30.0, 65.0, 95.0], 'w': 1.0}]

parameters_best_estimate: [3.0, 30.0, 65.0, 95.0]
# Disturbance order:  [S1_in, S2_in, Z_in, C_in].
# C_in > Z_in + S2_in  (95 ≥ 65 + 30 = 95)  so the inflow doesn't carry
# negative dissolved CO2 into the reactor.  Both Z_in and C_in are off the
# initial-state values (50, 60) so dZ/dt and dC/dt are both D-dependent at t=0.

extendedDS_bounds: None

design_space_dimensions:
- 'log_D'

global_n_aux_args: 1

aux_default: [0.5]
# Rollout-time default for the global aux slot. Here: α = 0.5 (published AM2
# fixed-bed retention from Bernard 2001). Used by subproblem_model.rollout
# when aux is not supplied externally; the DEUS sampling/optimization paths
# instead draw aux from KS_bounds.aux_args.

process_space_names: ['log_D']

mode:
  - backward
  - rollout

evaluation_mode: 'jax-pmap'

serial_graph: True

unit_op: 'dynamic'

n_theta: 4

fn_evals: 0

bypass_visualisations: True

edge_clip:
  - [0.0, 10.0]      # X1   (acidogenic biomass, g/L)
  - [0.0, 10.0]      # X2   (methanogenic biomass, g/L)
  - [0.0, 200.0]     # Z    (alkalinity, mmol/L)
  - [0.0, 20.0]      # S1   (COD, g/L)
  - [1.0e-4, 100.0]  # S2   (VFA, mmol/L) — strict positive floor
  - [0.0, 300.0]     # C    (TIC, mmol/L