case_study: cstr

make_markov: True

vmap_evaluations: True

eval_cost: True

num_nodes: 40

adjacency_matrix: None

n_design_args: 1

# One entry per aux slot; every node carries the whole block (the Markov
# template).  Order is positional: the model reads aux[i] for slot i.
#   global_var   -- edge-coupled, optimised at node 0
#   global_param -- edge-coupled, set before evaluation
#   local_param  -- per-node, never coupled, set before evaluation
aux:
  - name: setpoint
    type: local_param
    bounds: [0.80, 0.95]
    default: 0.85

n_input_args: 3

reject_time: 0.5

discount_factor: 0.99999

sizes:
  X_SIZE: 3        # [Ca, T, Tc_prev] — the previous coolant is a state so the
                   # move penalty is a function of (state, action), i.e. Markov
  U_SIZE: 1
  F_SIZE: 3        # [Ca, T, Tc] — the applied coolant flows on as the next Tc_prev
  G_SIZE: 2
  Z_SIZE: 2
  L_SIZE: 1
  PHI_SIZE: 0

KS_bounds:
  design_args:
  - - 290
    - 302
  aux_args: []     # derived from the `aux` block

parameters_samples: [{'c': [350.0, 1.0], 'w': 1.0}]

parameters_best_estimate: [350.0, 1.0]

# Hard-set per-node sampling box for DEUS so the backward sweep doesn't
# rely on init-derived edge bounds.  Order matches the training X columns:
# [Tc (control), CA, T, Tc_prev (input states)]; the aux tail is appended
# from the `aux` block, so its bounds are declared once.
# Bounds are wider than the optimal manifold so off-policy rollout states
# stay inside; T extends past the constraint band to give the multi-head
# classifier negative samples on both sides of the feasibility frontier.
# sp is sampled across its range so the surrogates learn the policy as a
# function of the setpoint, and can then be queried at any of them.
extendedDS_bounds:
  - [290.0, 302.0]   # Tc
  - [0.78, 0.97]     # CA
  - [314.0, 332.0]   # T
  - [290.0, 302.0]   # Tc_prev (input state)

# Disabled: the T floor (319) sat 4 K inside the real constraint band (315),
# so the clip teleported feasible states back to 319 at every node boundary —
# masking real infeasibility and corrupting the rollout trajectory.
edge_clip: None
# edge_clip:
#   - [0.7, 1.0]
#   - [319, 331]

design_space_dimensions:
- 'u0'

design_domain:
- 'real'
# 'real' = continuous; replace with a list of allowed integer values to
# declare an integer dim.  make_markov tiles this template across nodes.

# global_n_aux_args / aux_var_type / aux_default are derived from `aux`.

process_space_names: ['Tc']

mode:
  - backward
  - rollout

evaluation_mode: 'jax-pmap'

serial_graph: True

unit_op: 'dynamic'

n_theta: 2

fn_evals: 0

bypass_visualisations: True
