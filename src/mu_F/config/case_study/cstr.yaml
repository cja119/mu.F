case_study: cstr

make_markov: True

vmap_evaluations: True

eval_cost: True

num_nodes: 40

adjacency_matrix: None

n_design_args: 1

n_aux_args:
  node_0: 0
  (0,1): 0

n_input_args: 2

reject_time: 0.5

discount_factor: 0.99999

sizes:
  X_SIZE: 2
  U_SIZE: 1
  F_SIZE: 2
  G_SIZE: 2
  Z_SIZE: 2
  L_SIZE: 1
  PHI_SIZE: 0

KS_bounds:
  design_args:
  - - 290
    - 302
  aux_args:
  - - - None
      - None

parameters_samples: [{'c': [350.0, 1.0], 'w': 1.0}]

parameters_best_estimate: [350.0, 1.0]

# Hard-set per-node sampling box for DEUS so the backward sweep doesn't
# rely on init-derived edge bounds.  Order matches the training X columns:
# [Tc (control), CA (input state), T (input state)].
# Bounds are wider than the optimal manifold so off-policy rollout states
# stay inside; T extends past the constraint band to give the multi-head
# classifier negative samples on both sides of the feasibility frontier.
extendedDS_bounds:
  - [290.0, 302.0]   # Tc
  - [0.78, 0.97]     # CA
  - [314.0, 332.0]   # T

# Per-state clip applied by `make_cstr_edge` to the F slice that flows
# between nodes.  One [lo, hi] entry per F-state-dim (F_SIZE=2).
# Order: [Ca, T] (concentration, temperature).  Lifted from the legacy
# extendedDS_bounds [u0, Ca, T]; the design-variable entry isn't part of
# the F slice so doesn't belong here.
edge_clip:
  - [0.7, 1.0]
  - [319, 331]

design_space_dimensions:
- 'u0'

design_domain:
- 'real'
# 'real' = continuous; replace with a list of allowed integer values to
# declare an integer dim.  make_markov tiles this template across nodes.

global_n_aux_args: 0

aux_default: []
# Rollout-time default for the global aux slot (empty: no global aux vars here).

process_space_names: ['Tc']

mode:
  - backward
  - rollout

evaluation_mode: 'jax-pmap'

serial_graph: True

unit_op: 'dynamic'

n_theta: 2

fn_evals: 0

bypass_visualisations: True
