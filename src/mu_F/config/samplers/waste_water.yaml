
target_reliability: 1.
unit_wise_target_reliability: 1.
deus:
  activity_type: 'dsc'

notion_of_feasibility: 'positive'
ku_approximation: 'box'
vol_scale: 0.05
design_expansion: 0.0   # decision-dim sampling-box expansion (fraction of range; 0 = off)

# n_replacement / pmap_batch = number of pmap dispatches per iteration
# Good idea to set this the same as n_replacement to start with
pmap_batch: 250 

ns:
  n_live: 2500
  final_sample_live: 5000
  n_replacements: 250
  n_iter: 10000
  f0: 0.1
  alpha: 0.2
  prior: Uniform
  rejector: suob-ellipsoid
  log_evidence_estimation: True
