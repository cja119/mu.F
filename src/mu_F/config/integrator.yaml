
defaults:
  - case_study: cstr #markov_process #affine_study #serial_batch_reactor #tablet_press # convex_estimator # affine_study  #serial_batch_reactor #tablet_press # convex_estimator # serial_batch_reactor #convex_estimator # serial_batch_reactor # tablet_press #
  - model: cstr #markov_process #affine_study #serial_batch_reactor #tablet_press # convex_estimator # affine_study  #serial_batch_reactor #tablet_press # convex_estimator # serial_batch_reactor #convex_estimator # serial_batch_reactor #tablet_press #serial_batch_reactor
  - surrogate: cstr #markov_process #affine_study #serial_batch_reactor #tablet_press # convex_estimator # affine_study  #serial_batch_reactor #tablet_press # convex_estimator # serial_batch_reactor #convex_estimator # serial_batch_reactor #tablet_press #serial_batch_reactor
  - solvers: cstr #markov_process #affine_study #serial_batch_reactor #tablet_press # convex_estimator # affine_study  #serial_batch_reactor #tablet_press # convex_estimator # serial_batch_reactor #convex_estimator # serial_batch_reactor #tablet_press #serial_batch_reactor
  - samplers: cstr #markov_process #affine_study #serial_batch_reactor #tablet_press # convex_estimator # affine_study  #serial_batch_reactor #tablet_press # convex_estimator # serial_batch_reactor #convex_estimator # serial_batch_reactor #tablet_press #serial_batch_reactor
  - reconstruction: cstr #markov_process #affine_study #serial_batch_reactor #tablet_press # convex_estimator # affine_study  #serial_batch_reactor #tablet_press # convex_estimator # serial_batch_reactor #convex_estimator # serial_batch_reactor #tablet_press #serial_batch_reactor
  - init: cstr #markov_process #affine_study #serial_batch_reactor #tablet_press # convex_estimator # affine_study  #serial_batch_reactor #tablet_press # convex_estimator # serial_batch_reactor #convex_estimator # serial_batch_reactor #tablet_press #serial_batch_reactor

device: cpu        # cpu | gpu — JAX backend

max_devices: 12

dispatch: vmap     # pmap | vmap | serial — how the per-shard parallelism
                   # runs.  pmap = multi-device; vmap = single-program,
                   # XLA-fused; serial = Python for-loop (debug).

formulation: deterministic # probabilistic  # #  #  #
method: [decomposition, multiple_shooting] #decomposition_constraint_tuner #decomposition #direct # decomposition # # #direct # decomposition_constraint_tuner # direct # decomposition # #decomposition #decomposition # direct #
max_uncertain_samples: 50

# Global auxiliary handling.  Set to a list (e.g. [0.5]) to pin the aux as a
# fixed operating parameter; leave null to make it a free decision in the root
# node's recovery NLP, whose solved value is carried through the rollout.
aux_override: null

log_level: INFO

