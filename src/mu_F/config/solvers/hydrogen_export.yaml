# Septal SQP solver settings.
#
# `cfg.method` selects the active sub-block (see main.py `_select_solver_block`):
#   method ∈ {decomposition, decomposition_constraint_tuner} → `decomposition`
#   method ∈ {direct, single_shooting, multiple_shooting}   → `monolithic`

decomposition:
  n_starts: 1
  n_sobol_screen: 1024        # L1-penalty screen pool size per (head, combo)
  feasibility_tol: 1.0e-3     # surrogate ANNs can't realistically hit 1e-6 KKT
  optimality_tol:  1.0e-3     # in finite SQP iters
  max_iter: 10                # septal's scan-loop allocates trace buffer per
                              # iter — keep modest to bound memory per compile
  screen_penalty: 1.0e5       # large enough to dominate CTG range (~1e4)
                              # in the L1 screener score

  # Per-evaluator overrides (all keys optional).  Every knob inherits from
  # the flat block above unless overridden here.  Supported keys per
  # evaluator: n_starts, n_sobol_screen, feasibility_tol, optimality_tol,
  # max_iter, screen_penalty.
  #
  # Available evaluator names (`_eval_name`):
  #   backward, cost_to_go, current_constraint, current_cost,
  #   forward, forward_decentralised, probability, post_process
  #
  # Uncomment any sub-block to override:
  #
  cost_to_go:
    max_iter: 50              # CTG's classifier-as-constraint can need
    n_sobol_screen: 4096        # L1-penalty screen pool size per (head, combo)
    feasibility_tol: 1.0e-2     # surrogate ANNs can't realistically hit 1e-6 KKT
    optimality_tol:  1.0e-2     # in finite SQP iters
  # backward:
  #   n_starts: 4               # multi-start backward when the feasibility
  #                             # landscape is multi-modal

monolithic:
  feasibility_tol: 1.0e-3
  optimality_tol:  1.0e-3
  max_iter: 500
  use_exact_hessian: true
  scale_variables: true       # rescale decision vec + defect residuals to [0, 1]

  # Integer handling for the monolithic NLP.  'none' relaxes integer design
  # dims to their continuous hull (legacy behaviour); 'dfs_bb' runs the DFS
  # branch-and-bound wrapper (solvers/branch_and_bound.py) around septal —
  # one compiled SQP serves all B&B nodes via parametric integer bounds.
  integer_backend: none       # 'none' | 'dfs_bb'
  dfs_bb:
    time_budget: 600          # wall-clock seconds
    max_nodes: 2000           # visited-node cap
    log_every: 25
