# Septal SQP solver settings.
#
# This is the one and only place we configure the constrained NLP backend.
# `tol` maps to both `SQPConfig.tol_stationarity` and `SQPConfig.tol_feasibility`.
# Every evaluator in `constraints.evaluators.*` reads `cfg.solvers.tol`,
# `cfg.solvers.n_starts` and `cfg.solvers.n_sobol_screen`.

standardised: true

n_starts: 4           # multi-start count for Sobol initial guesses
n_sobol_screen: 16384 # pre-generated Sobol points used to seed each shard
tol: 1.0e-6           # SQP KKT tolerance (stationarity + feasibility)
