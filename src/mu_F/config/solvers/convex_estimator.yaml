# Septal SQP solver settings.

standardised: false  # DEPRECATED: no effect — every surrogate self-scales

decomposition:
  n_starts: 4
  n_sobol_screen: 16384
  feasibility_tol: 1.0e-6
  optimality_tol:  1.0e-6
  max_iter: 30
  use_exact_hessian: true
  use_vmap: false

monolithic:
  n_starts: 4
  n_sobol_screen: 16384
  feasibility_tol: 1.0e-6
  optimality_tol:  1.0e-6
  max_iter: 30
  use_exact_hessian: true
  use_vmap: false
