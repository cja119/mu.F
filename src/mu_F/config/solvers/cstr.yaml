# Septal SQP solver settings.

decomposition:
  n_starts: 4
  n_sobol_screen: 256
  feasibility_tol: 1.0e-4
  optimality_tol:  1.0e-4
  max_iter: 30

monolithic:
  feasibility_tol: 1.0e-4
  optimality_tol:  2.0e-2   # stationarity floor set by the optimize-through-integration gradient bias
  max_iter: 200
  use_exact_hessian: true
  scale_variables: true   # rescale decision vector + defect residuals to [0, 1] coords
