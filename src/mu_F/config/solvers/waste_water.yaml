# Septal SQP solver settings.

standardised: false  # DEPRECATED: no effect — every surrogate self-scales

n_starts: 4           # multi-start count for Sobol initial guesses
n_sobol_screen: 256  # pre-generated Sobol points used to seed each shard
feasibility_tol: 1.0e-2  # SQP constraint-satisfaction tolerance
optimality_tol:  1.0e-2  # SQP KKT stationarity tolerance
max_iter: 30             # SQP Newton-step budget (scan length; runs all steps regardless of convergence)

use_vmap: true       # set true to swap pmap for jit(vmap(...)) in the pmap-backed evaluators
