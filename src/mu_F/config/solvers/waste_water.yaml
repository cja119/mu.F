# Septal SQP solver settings.

decomposition:
  n_starts: 4
  n_sobol_screen: 256
  feasibility_tol: 1.0e-2
  optimality_tol:  1.0e-2
  max_iter: 30

monolithic:
  feasibility_tol: 1.0e-2
  optimality_tol:  1.0e-2
  max_iter: 1000
  use_exact_hessian: true
  scale_variables: true   # rescale decision vector + defect residuals to [0, 1] coords
