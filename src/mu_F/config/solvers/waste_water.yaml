# Septal SQP solver settings.

decomposition:
  n_starts: 2
  n_sobol_screen: 32
  feasibility_tol: 1.0e-2
  optimality_tol:  1.0e-2
  max_iter: 5

  # a second pass rescues nothing here (measured: 0 of 57 at 3x), so leave it off
  retry_factor: 1

  # worst-case outer over theta, budgeted separately so it does not multiply the inner
  adversarial:
    n_sobol_screen: 512   # coarse phase: broad Sobol sweep over theta
    n_starts: 4           # best of those become outer SQP starts
    max_iter: 25

  cost_to_go:
    n_sobol_screen: 128
    n_starts: 4
    max_iter: 20

monolithic:
  feasibility_tol: 1.0e-4
  optimality_tol:  2.0e-2     # optimize-through-integration stationarity floor (1e-4 unreachable)
  max_iter: 500
  use_exact_hessian: false    # BFGS: exact Hessian OOMs through 72 chained diffrax solves
  scale_variables: true   # rescale decision vector + defect residuals to [0, 1] coords
  warm_start: rollout         # physically-consistent forward-rollout start
