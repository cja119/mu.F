# Septal SQP solver settings.

decomposition:
  n_starts: 2
  n_sobol_screen: 32
  feasibility_tol: 1.0e-2
  optimality_tol:  1.0e-2
  max_iter: 5

  cost_to_go:
    n_sobol_screen: 128
    n_starts: 4
    max_iter: 20

monolithic:
  feasibility_tol: 1.0e-4
  optimality_tol:  2.0e-2     # optimize-through-integration stationarity floor (1e-4 unreachable)
  max_iter: 500
  use_exact_hessian: false    # BFGS: exact Hessian OOMs through 72 chained diffrax solves
  scale_variables: true   # rescale decision vector + defect residuals to [0, 1] coords
  warm_start: rollout         # physically-consistent forward-rollout start
