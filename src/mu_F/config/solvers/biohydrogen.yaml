# Septal SQP solver settings — two blocks with identical schema.  `main.py`
# picks the active block at runtime based on `cfg.method`:
#   decomposition / decomposition_constraint_tuner  →  cfg.solvers.decomposition
#   single_shooting / multiple_shooting             →  cfg.solvers.monolithic

standardised: false  # DEPRECATED: no effect — every surrogate self-scales

decomposition:
  n_starts: 4
  n_sobol_screen: 4096
  feasibility_tol: 1.0e-4
  optimality_tol:  1.0e-4
  max_iter: 30
  use_exact_hessian: true
  use_vmap: false

monolithic:
  n_starts: 4
  n_sobol_screen: 4096
  feasibility_tol: 1.0e-4
  optimality_tol:  1.0e-4
  max_iter: 30
  use_exact_hessian: false   # skips 2nd-order AD through chained diffrax solves
  use_vmap: false
