# Septal SQP solver settings — two blocks with identical schema.  `main.py`
# picks the active block at runtime based on `cfg.method`:
#   decomposition / decomposition_constraint_tuner  →  cfg.solvers.decomposition
#   single_shooting / multiple_shooting             →  cfg.solvers.monolithic

decomposition:
  n_starts: 4
  n_sobol_screen: 4096
  feasibility_tol: 1.0e-4
  optimality_tol:  1.0e-4
  max_iter: 30
  cost_to_go:
    max_iter: 60          # backward cost-to-go NLP

monolithic:
  feasibility_tol: 1.0e-4
  optimality_tol:  1.0e-4
  max_iter: 30
  use_exact_hessian: false   # skips 2nd-order AD through chained diffrax solves
  scale_variables: true   # rescale decision vector + defect residuals to [0, 1] coords
  warm_start: decomposition  # 'decomposition' (seed from decomp rollout, paper-style),
                             # 'rollout' (Sobol/forward-simulated start), or 'midpoint'
  n_sobol_screen: 32      # >1: Sobol-sample controls, roll each, keep lowest L1 merit
  screen_penalty: 1.0e3   # L1 weight on path-constraint violation in the screen

  # Passed straight through to septal's SQPConfig. Powell damping inflates the BFGS
  # scale, collapsing the step while alpha stays at 1, so septal's own safeguards
  # (which watch alpha, and cond(H)) never fire. An alpha_tol above 1 makes the
  # stagnation test true every iteration, turning patience into a restart interval:
  # the Hessian returns to a scaled identity every `stagnation_patience` steps.
  sqp:
    stagnation_alpha_tol: 2.0
    stagnation_patience: 10
