[tool.poetry]
name = "mu_F"
version = "0.0.1"
description = "Multi-unit feasibility"
authors = ["Max Mowbray <maxmowbray@msn.com>"]
packages = [
    {include = "mu_F", from = "src"},
    {include = "deus", from = "src/mu_F/samplers/algorithms/deus/src"},
]

# Note: Poetry will exclude files declared in .gitignore when creating the python package file.

[tool.poetry.dependencies]
python = ">=3.10,<3.13"

# JAX ecosystem
jax = ">=0.10.1"
jaxtyping = ">=0.3.10"
diffrax = ">=0.7.2"
flax = ">=0.12.7"
optax = ">=0.2.8"
beartype = ">=0.16.4"

# Torch / GP surrogate
torch = ">=2.12.0"
gpytorch = ">=1.15.2"

# Scientific
numpy = ">=2.4.6"
scipy = ">=1.17.1"
pandas = ">=3.0.3"
scikit-learn = ">=1.9.0"
networkx = ">=3.6.1"
sobol_seq = ">=0.2.0"
openpyxl = ">=3.1.5"

# Plotting
matplotlib = ">=3.10.9"
seaborn = ">=0.13.2"

# Config / serialisation
hydra-core = ">=1.3.2"
omegaconf = ">=2.3.0"
cloudpickle = ">=3.1.2"
dill = ">=0.3.9"

# Case-study dynamics
pcgym = ">=0.1.6"

# Project package (git)
septal = {git = "https://github.com/mycelia-i/septal.git", branch = "main"}

[tool.poetry.group.dev.dependencies]
pylint = "2.15.10"
isort = "^5.0.0"
pytest = "^7.2.1"
pytest-cov = "^4.0.0"
taskipy = "^1.2.0"
black = "^22.1.0"
ipykernel = "^6.29.5"
ruff = "^0.11.8"
autocopyright = "^1.1.0"
sipsolve = {path = "src/mu_F/post_processes/algorithms/sipsolve/dist_setup/sipsolve-0.0.1.tar.gz"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
