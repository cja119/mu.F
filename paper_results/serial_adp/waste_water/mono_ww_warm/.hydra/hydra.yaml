hydra:
  run:
    dir: outputs/mono_ww_warm
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=outputs/mono_ww_warm
    - hydra.mode=RUN
    task:
    - case_study=waste_water
    - model=waste_water
    - samplers=waste_water
    - surrogate=waste_water
    - solvers=waste_water
    - reconstruction=waste_water
    - init=waste_water
    - method=multiple_shooting
    - case_study.num_nodes=30
    - solvers.monolithic.warm_start=decomposition
  job:
    name: main
    chdir: null
    override_dirname: case_study.num_nodes=30,case_study=waste_water,init=waste_water,method=multiple_shooting,model=waste_water,reconstruction=waste_water,samplers=waste_water,solvers.monolithic.warm_start=decomposition,solvers=waste_water,surrogate=waste_water
    id: ???
    num: ???
    config_name: integrator
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.1'
    cwd: /Users/cja119/Documents/mu.F/.claude/worktrees/margin-regressor
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/cja119/Documents/mu.F/.claude/worktrees/margin-regressor/src/mu_F/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /Users/cja119/Documents/mu.F/.claude/worktrees/margin-regressor/outputs/mono_ww_warm
    choices:
      init: waste_water
      reconstruction: waste_water
      samplers: waste_water
      solvers: waste_water
      surrogate: waste_water
      model: waste_water
      case_study: waste_water
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
