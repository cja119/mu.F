    enabled: false
    strategy: cluster_gaussian
    n_samples: 2500
    radius: 3.0
solvers:
  decomposition:
    n_starts: 4
    n_sobol_screen: 4096
    feasibility_tol: 0.0001
    optimality_tol: 0.0001
    max_iter: 30
    cost_to_go:
      max_iter: 60
  monolithic:
    feasibility_tol: 0.0001
    optimality_tol: 0.0001
    max_iter: 200
    use_exact_hessian: false
    scale_variables: true
    warm_start: decomposition
    n_sobol_screen: 32
    screen_penalty: 1000.0
    sqp:
      stagnation_alpha_tol: 2.0
      stagnation_patience: 10
