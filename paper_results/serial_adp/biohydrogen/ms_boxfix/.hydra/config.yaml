      - - tanh
        - tanh
      decaying_lr_and_clip_param: true
      learning_rate: 0.01
      terminal_lr: 1.0e-05
      num_epochs: 1000
      min_delta: 1.0e-06
      patience: 50
      batch_size: 264
      weight_decay: 0.0
  forward_evaluation_surrogate: false
