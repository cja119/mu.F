hydra:
  run:
    dir: outputs/bare_decomp_proj
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=outputs/bare_decomp_proj
    - hydra.mode=RUN
    task:
    - case_study=biohydrogen
    - model=biohydrogen
    - surrogate=biohydrogen
    - solvers=biohydrogen
    - samplers=biohydrogen
    - reconstruction=biohydrogen
    - init=biohydrogen
    - case_study.num_nodes=30
    - model.integration.scheme=Kvaerno5
    - model.integration.step_size_controller=pid
    - model.integration.max_steps=1000000
    - method=[decomposition]
    - samplers.ns.n_live=8000
    - solvers.decomposition.max_iter=30
    - solvers.decomposition.n_starts=4
  job:
    name: main
    chdir: null
    override_dirname: case_study.num_nodes=30,case_study=biohydrogen,init=biohydrogen,method=[decomposition],model.integration.max_steps=1000000,model.integration.scheme=Kvaerno5,model.integration.step_size_controller=pid,model=biohydrogen,reconstruction=biohydrogen,samplers.ns.n_live=8000,samplers=biohydrogen,solvers.decomposition.max_iter=30,solvers.decomposition.n_starts=4,solvers=biohydrogen,surrogate=biohydrogen
    id: ???
    num: ???
    config_name: integrator
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.1'
    cwd: /Users/cja119/Documents/mu.F/.claude/worktrees/bh-movepen
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/cja119/Documents/mu.F/.claude/worktrees/bh-movepen/src/mu_F/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /Users/cja119/Documents/mu.F/.claude/worktrees/bh-movepen/outputs/bare_decomp_proj
    choices:
      init: biohydrogen
      reconstruction: biohydrogen
      samplers: biohydrogen
      solvers: biohydrogen
      surrogate: biohydrogen
      model: biohydrogen
      case_study: biohydrogen
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
